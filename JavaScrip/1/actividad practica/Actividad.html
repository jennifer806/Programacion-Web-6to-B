
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad Práctica</title>

    <style>
        body {
            background: #fff0f5;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 20px;
            color: #bd6689;
        }

        h1 {
            color: #d77da0;
        }

        .botones {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background: #f4b8d0;
            color: #79445b;
            border: none;
            padding: 14px 22px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #df91b2;
            color: white;
            transform: translateY(-3px);
        }

        .lila {
            background: #e5d5f5;
            color: #685078;
        }

        .crema {
            background: #f9dfc4;
            color: #805b42;
        }
    </style>
</head>

<body>

    <h1>Actividad práctica </h1>
    <p>Prueba las diferentes funciones de JavaScript.</p>

    <div class="botones">

        <button onclick="saludar()">Saludar</button>

        <button class="lila" onclick="despedir()">Despedir</button>

        <button class="crema" onclick="saludarCompleto()">
            Saludo completo
        </button>

        <button onclick="mostrarConsola()">
            Ver en consola
        </button>

    </div>

    <script>

      
        function saludar() {
            alert("¡Hola, Jennifer!");
        }

      
        function despedir() {
            alert("¡Hasta luego!");
        }

       
        function saludarCompleto() {
            alert("¡Hola, Jennifer!");
            alert("Año escolar 2026-2027");
        }

        
        function mostrarConsola() {
            console.log("¡Hola, Jennifer!");
        }

    </script>

</body>
</html>
