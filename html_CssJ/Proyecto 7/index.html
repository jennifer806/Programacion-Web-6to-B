
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenddy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <ul>

        <li style="--i:#00b4d8;--j:#0077b6;">
            <span class="icon">
                <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
                <span class="title">Mensajes</span>
            </span>
        </li>

        <li style="--i:#f4a261;--j:#e76f51;">
            <span class="icon">
                <ion-icon name="camera-outline"></ion-icon>
                <span class="title">Fotografía</span>
            </span>
        </li>

        <li style="--i:#2a9d8f;--j:#176b62;">
            <span class="icon">
                <ion-icon name="musical-notes-outline"></ion-icon>
                <span class="title">Música</span>
            </span>
        </li>

        <li style="--i:#5271ff;--j:#2945b8;">
            <span class="icon">
                <ion-icon name="game-controller-outline"></ion-icon>
                <span class="title">Juegos</span>
            </span>
        </li>

        <li style="--i:#d4a373;--j:#a66a3f;">
            <span class="icon">
                <ion-icon name="globe-outline"></ion-icon>
                <span class="title">Internet</span>
            </span>
        </li>

    </ul>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>

</body>
</html>
