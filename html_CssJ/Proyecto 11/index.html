* {
  margin: 0;

  box-sizing: border-box;

body {
 
  background-repeat: no-repeat;

}

section {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.box {
  position: relative;
  min-width: 350px;
  min-height: 400px;
  background: rgba(255, 255, 255, 0.1);
  box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-right: 1px solid rgba(255, 255, 255, 0.2);
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 10px;
  z-index: 10;
  padding: 20px;
  -webkit-backdrop-filter: blur(25px);
          backdrop-filter: blur(25px);
}
.box h3 {
  color: #fff;
  margin-bottom: 20px;
}
.box .list {
  position: relative;
  display: flex;
  padding: 10px;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 10px;
  margin: 10px 0;
  cursor: pointer;
  transition: 0.5s;
  overflow: hidden;
}
.box .list:hover {
  background: #fff;
  box-shadow: -15px 30px 50px rgba(0, 0, 0, 0.5);
  transform: scale(1.15) translateX(30px) translateY(-15px);
  z-index: 1000;
}
.box .list:hover .content .rank {
  right: 20px;
}
.box .list:hover .content h4, .box .list:hover .content p {
  color: #333;
}
.box .list .imgBx {
  position: relative;
  width: 60px;
  height: 60px;
  border-radius: 10px;
  overflow: hidden;
  margin-right: 10px;
}
.box .list .imgBx img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  -o-object-fit: cover;
     object-fit: cover;
}
.box .list .content {
  display: flex;
  flex-direction: column;
  justify-content: center;
  color: #fff;
}
.box .list .content .rank {
  position: absolute;
  right: -50px;
  color: rgb(1, 247, 255);
  transition: 0.5s;
  font-size: 2em;
}
.box .list .content .rank small {
  font-weight: 500;
  opacity: 0.25;
}
.box .list .content h4 {
  line-height: 1.2em;
  font-weight: 600;
  transition: 0.5s;
}
.box .list .content p {
  font-size: 0.75em;
  transition: 0.5s;
}
