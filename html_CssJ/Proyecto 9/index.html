
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenddy</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <article class="container">
        <div class="card">

            <div class="imgBx">
                <img
                    src="img/mini-escudo.png"
                    alt="Poción de escudo pequeño de Fortnite"
                >
            </div>

            <div class="contentBx">
                <p class="eyebrow">FORTNITE · CONSUMIBLE</p>

                <h2>Mini Shield Potion</h2>

                <p class="description">
                    Una pequeña poción que restaura 25 puntos
                    de escudo. Bebe rápidamente y prepárate
                    para volver al combate.
                </p>

                <div class="size">
                    <h3>Shield</h3>
                    <span>+25 HP</span>
                </div>

                <div class="color">
                    <h3>Rarity</h3>
                    <span class="common" title="Común"></span>
                    <span class="blue" title="Azul"></span>
                    <span class="energy" title="Energía"></span>
                </div>

                <a href="https://www.fortnite.com/" class="buyButton" target="_blank">
                    Jugar Ahora
                </a>
            </div>

        </div>
    </article>

</body>
</html>
