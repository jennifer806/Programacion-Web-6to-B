
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Anthony</title>

    <style>
        body {
            background: #1e293b;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 100px 20px;
            color: #e2e8f0;
        }

        h1 {
            color: #60a5fa;
        }

        .botones {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            background: #334155;
            color: #f1f5f9;
            border: none;
            padding: 14px 22px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2563eb;
            color: white;
            transform: translateY(-3px);
        }

        .lila {
            background: #475569;
            color: #f1f5f9;
        }

        .crema {
            background: #1d4ed8;
            color: #ffffff;
        }
    </style>
</head>

<body>

    <h1>Anthony</h1>
    <p>Prueba las diferentes funciones de JavaScript.</p>

    <div class="botones">

        <button onclick="saludar()">Saludar</button>

        <button class="lila" onclick="despedir()">Despedir</button>

        <button class="crema" onclick="saludarCompleto()">
            Saludo completo
        </button>

        <button onclick="mostrarConsola()">
            Ver en consola
        </button>

    </div>

    <script>

        function saludar() {
            alert("¡Hola, Anthony!");
        }

        function despedir() {
            alert("¡Hasta luego!");
        }

        function saludarCompleto() {
            alert("¡Hola, Anthony!");
            alert("Clase Keyla");
        }

        function mostrarConsola() {
            console.log("¡Hola, Anthony!");
        }

    </script>

</body>
</html>
