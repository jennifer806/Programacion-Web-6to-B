
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Anthony</title>

    <style>
        body {
            background: #1e293b;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 150px;
            color: #f4f0f2;
        }

        h1 {
            color: #efeaec;
        }

        button {
            background: #e9efef;
            color: #1e293b;
            border: none;
            padding: 15px 35px;
           
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e8ebf1;
            color: #071834;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h1>Anthony</h1>
    <p>Presiona el botón para recibir un saludo.</p>

    <button onclick="saludar()">Saludar</button>

    <script>
        function saludar() {
            alert("¡Bienvenido Anthony!");
        }
    </script>

</body>
</html>
