
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jennifer VS</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <article class="container">
        <div class="card">

            <div class="imgBx">
                <img
                    src="img/vainilla.png"
                    alt="Pink Glazed Vanilla & Dream Body Mist"
                >
            </div>

            <div class="contentBx">
                <p class="eyebrow">PINK · BODY MIST</p>

                <h2>Glazed Vanilla & Dream</h2>

                <p class="description">
                    Una fragancia dulce y cremosa con notas de
                    vainilla, coco y caramelo suave.
                </p>

                <div class="size">
                    <h3>Size</h3>
                    <span>250 ml</span>
                </div>

                <div class="color">
                    <h3>Notes</h3>
                    <span class="vanilla" title="Vainilla"></span>
                    <span class="coconut" title="Coco"></span>
                    <span class="caramel" title="Caramelo"></span>
                </div>

                <a href="#" class="buyButton">Comprar</a>
            </div>

        </div>
    </article>

</body>
</html>
