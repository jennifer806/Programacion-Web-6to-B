<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="card">
        <div class="card-banner">
            <img src="https://i.pinimg.com/1200x/cc/7a/b6/cc7ab69ab9c6f60476c01d3b30727049.jpg" alt="Banner" class="banner-img">
        </div>

        <div class="card-middle">
       
            <div class="avatar-container">
                <img src="https://i.pinimg.com/1200x/d6/c6/60/d6c660aeed49ed122fbdaf37c43069bd.jpg" alt="Avatar" class="avatar-img">
            </div>
            
            <div class="card-info">
                <h2 class="card-name">Crumbl Cookies</h2>
                <span class="card-type">The best</span>
            </div>
        </div>

     
        <div class="card-footer">
            <div class="stat-box">
                <span class="stat-title">Fresa</span>
                <img src="https://i.pinimg.com/736x/4b/0f/10/4b0f10a6ea7aad881ccaefc4aca6edae.jpg" alt="Avatar" class="avatar-img" height="10px" width="10px">
            </div>
            
            <div class="stat-box">
                <span class="stat-title">Crema</span>
              <img src="https://i.pinimg.com/736x/b4/5d/6d/b45d6d9ac12a9d0f9fe8ede139c99971.jpg" alt="Avatar" class="avatar-img">
            </div>
          
            <div class="stat-box">
                <span class="stat-title">Chocolate</span>
                <img src="https://i.pinimg.com/736x/1b/ea/b1/1beab16c4460ba9cc5316357fa503b4e.jpg" alt="Avatar" class="avatar-img">
            </div>
       
    </div>

</body>
</html>
