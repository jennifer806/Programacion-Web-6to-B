<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="shortcut icon" href="img/netflix.png" type="image/x-icon">
    </head>

<body>
    <main>
      <header>
        <a href="#" class="logo"><img src="img/Logonetflix.png" alt="logo netflix"></a>
        <ul class="navigation">
          <li><a href="#">Home</a></li>
          <li><a href="#">TV Shows</a></li>
          <li><a href="#">Movies</a></li>
          <li><a href="#">Latest</a></li>
          <li><a href="#">My List</a></li>
        </ul>
        <div class="search">
          <input type="text" placeholder="Search">
          <button class="btnbuscar"><span class="material-icons">search</span></button>
        </div>
      </header>
      <section class="banner">
        <img src="img/han.png" alt="personaje" class="bg">
        <span class="sombraImg"></span>
        <div class="content">
          <img src="img/my name.png" class="movieTitle">
          <h4>
            <span>2021</span>
            <span><i>16+</i></span>
            <span>1 Season</span>
            <span>Series</span>
          </h4>
          <p>
            After the murder of her 
            father, a woman with a thirst 
            for revenge decides to trust the 
            powerful head of a criminal network... 
            and infiltrates the police under his 
            orders.
          </p>
          <div class="buttons">
            <a href="#">Play</a>
            <a href="#">My list</a>
          </div>
        </div>
        <a href="#" class="play" onclick="toggleVideo();">
            <img src="img/play.png">Watch Trailer
        </a>
      </section>
      <section class="trailer">
        <video src="img/My Name .mp4" controls="true"></video>
        <img src="img/close.png" class="close" onclick="toggleVideo();">

      </section>
    </main>
    <script>
        function toggleVideo(){
            const trailer= document.querySelector(".trailer");
            const video = document.querySelector("video");
            trailer.classList.toggle("active");
            video.currentTime=0;
            video.pause();

        }
    </script>
   
</body>
</html>
